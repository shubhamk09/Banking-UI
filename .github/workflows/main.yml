name: Build and Test Qt Project

on: [push, pull_request]

jobs:
  build:
    # Use a strategy matrix to build across different operating systems (e.g., Ubuntu, Windows, macOS)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: Install build dependencies for Linux
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install build-essential libgl1-mesa-dev -y
        # Note: Additional dependencies may be needed depending on the specific Qt modules used.

      # Install Qt using the specialized GitHub action
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          # Specify the Qt version, e.g., '6.5.2' or '5.15.2'
          version: '6.5.2'
          # Specify required modules beyond the default (e.g., qtcharts, qtwebengine)
          # modules: qtcharts qtwebengine
          # Enable caching to speed up subsequent runs
          cache: true
          # Set environment variables for CMake to find Qt automatically
          # This is designed for CI pipelines and sets variables like PATH, Qt6_DIR
          set-envs: true

      # Optional: Use ilammy/msvc-dev-cmd for Windows with MSVC
      - name: Setup MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        # This action sets up the Visual Studio compiler environment variables

      - name: Configure CMake project
        # The 'install-qt-action' automatically sets environment variables so CMake finds Qt
        run: cmake -S . -B build

      - name: Build project
        # This command builds the project using the configuration generated by CMake
        run: cmake --build build

      # Optional: Run tests
      - name: Run tests
        # Command depends on how you configured your tests
        # run: ./build/your_test_executable 

      # Optional: Upload the build artifact (e.g., the final executable or library)
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: my-qt-app-artifact-${{ matrix.os }}
          path: build/your_app_name # Adjust path to your build output
